services:
  postgres:
    image: postgres:16-alpine
    container_name: oops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: oops
      POSTGRES_PASSWORD: oops
      POSTGRES_DB: oops
    ports:
      - "5432:5432"
    volumes:
      # 注意：旧卷 oops_pgdata 存有此前实验项目(PG17)的数据，刻意不复用
      - pgdata16:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oops -d oops"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 本地 dev 专用 S3 兼容后端（私有桶）。生产/云上不经 compose：
  # 在 .env.local 把 S3_* 指向 Supabase / 阿里云 OSS / 腾讯云 COS 即可切换，代码零改动。
  minio:
    image: minio/minio:latest
    container_name: oops-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 一次性 job：建私有桶 oops-assets（与 .env.local 的 S3_BUCKET 对应）
  minio-init:
    image: minio/mc:latest
    container_name: oops-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/oops-assets;
      mc anonymous set none local/oops-assets;
      echo 'bucket oops-assets ready (private)';
      "
    restart: "no"

volumes:
  pgdata16:
  miniodata:
